version: '3.8' 
services:
    db:
        image: postgres:13
        container_name: my_postgres
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - ./docker_data/postgres:/var/lib/postgresql/data
    
    redis:
        image: redis:7-alpine
        container_name: my_redis
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - ./docker_data/redis:/data

    app:
        build: .
        container_name: nifty_vol_api
        restart: always
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            - PORT=8000
            - DB_HOST=db
            - DB_PORT=5432
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        volumes:
            - ./models:/app/models
            - ./data:/app/data
        depends_on:
            - db
            - redis

    prometheus:
        image: prom/prometheus:latest
        container_name: my_prometheus
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "127.0.0.1:9090:9090"
        depends_on:
            - app

    grafana:
        image: grafana/grafana:latest
        container_name: my_grafana
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
        ports:
            - "127.0.0.1:3000:3000"
        depends_on:
            - prometheus