version: '3.8' 
services:
    db:
        image: postgres:13
        container_name: my_postgres
        environment:
            POSTGRES_USER: myuser
            POSTGRES_PASSWORD: mypassword
            POSTGRES_DB: crypto_features
        ports:
            - "5432:5432"
        volumes:
            - ./docker_data/postgres:/var/lib/postgresql/data
    
    redis:
        image: redis:7-alpine
        container_name: my_redis
        ports:
            - "6379:6379"
        volumes:
            - ./docker_data/redis:/data

    app:
        build: .
        container_name: nifty_vol_api
        restart: always
        ports:
            - "8000:8000"
        environment:
            - PORT=8000
            - DB_HOST=db
            - DB_PORT=5432
            - DB_USER=myuser
            - DB_PASSWORD=mypassword
            - DB_NAME=crypto_features
            - REDIS_HOST=redis
            - REDIS_PORT=6379
        volumes:
            - ./models:/app/models
            - ./data:/app/data
        depends_on:
            - db
            - redis

    prometheus:
        image: prom/prometheus:latest
        container_name: my_prometheus
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
        depends_on:
            - app

    grafana:
        image: grafana/grafana:latest
        container_name: my_grafana
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
        ports:
            - "3000:3000"
        depends_on:
            - prometheus